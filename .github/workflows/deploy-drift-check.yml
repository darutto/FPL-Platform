# deploy-drift-check.yml
# ======================
# Fails loudly when the deployed backend is not running the commit on main.
#
# WHY THIS EXISTS
# ---------------
# Between 2026-07-26 and 2026-08-09, prod served a commit 161 deploys behind
# main. Nothing was broken, nothing alerted, and every check was green: CI tests
# the code in the repository, not the code that is running. The whole FI-7
# series sat undeployed for two weeks and the drift was found by hand.
#
# `GET /version` already answered this — it answers it whenever somebody asks.
# For 161 deploys, nobody asked. An endpoint that reports the truth on request
# is a *property*; a job that compares it to `origin/main` and fails is the
# *mechanism*. That distinction is the difference between "this cannot happen
# unnoticed again" and "this cannot happen unnoticed again as long as someone
# remembers to curl".
#
# WHY SCHEDULED AND NOT A POST-MERGE STEP
# ---------------------------------------
# Drift is not created at merge time. A deploy can fail, be rolled back, or
# never trigger, hours after CI went green — so a check that runs only on push
# would have passed on the very merge that began the two-week gap. It also runs
# on push to main to catch an immediately-failed deploy, and by hand.
name: Deploy drift check

on:
  schedule:
    # Every 6 hours. Cheap, and bounds undetected drift to one window rather
    # than to however long it takes someone to wonder.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  drift:
    name: Deployed commit matches main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare deployed commit to origin/main
        env:
          # Overridable so a redeployed or renamed service does not need a code
          # change to keep this honest.
          BACKEND_URL: ${{ vars.FPL_BACKEND_URL || 'https://fpl-backend-production-4151.up.railway.app' }}
        run: |
          set -euo pipefail

          EXPECTED="$(git rev-parse origin/main)"

          # A push run races its own deploy: the job starts the moment the merge
          # lands, long before the platform has built it. Poll rather than fail
          # on a difference that is only a few minutes old.
          ATTEMPTS=1
          [ "${GITHUB_EVENT_NAME}" = "push" ] && ATTEMPTS=10

          for i in $(seq 1 "$ATTEMPTS"); do
            BODY="$(curl -fsS --max-time 20 "${BACKEND_URL}/version" || true)"
            DEPLOYED="$(printf '%s' "$BODY" | jq -r '.commit // empty')"

            # An unreachable or shapeless endpoint is a failure, never a pass.
            # The check must not go quiet in exactly the situation it exists for.
            if [ -z "$DEPLOYED" ]; then
              echo "::warning::attempt $i: /version returned no commit field (body: ${BODY:-<empty>})"
            elif [ "$DEPLOYED" = "$EXPECTED" ]; then
              echo "deployed commit matches main: $DEPLOYED"
              exit 0
            else
              echo "attempt $i: deployed=$DEPLOYED expected=$EXPECTED"
            fi
            [ "$i" -lt "$ATTEMPTS" ] && sleep 60 || true
          done

          echo "::error::Deployed backend is not running main."
          echo "  expected (origin/main): $EXPECTED"
          echo "  deployed (/version):    ${DEPLOYED:-<unreachable or missing .commit>}"
          echo ""
          echo "Prod ran a commit 161 deploys behind main for two weeks without"
          echo "anything going red. If this is a failed or missing deploy, redeploy;"
          echo "if /version is unreachable, that is also a failure worth waking up to."
          exit 1
