name: EO Top-10K Sample

# Tier effective-ownership (EO) track. Samples 2,000 entries from the top 10,000
# (every 5th rank) or the top 100,000 (two entries on every 2nd standings page), reads their picks for a gameweek whose deadline
# has passed, and computes per-player ownership / captaincy / bench / EO %.
# Two ways to run. Manual: `gh workflow run eo-top10k.yml` (inputs below, dry run by
# default). Scheduled: every 3 hours, a gate step (no secrets) reads the FPL bootstrap and
# finds the latest gameweek whose deadline passed 30+ minutes ago; the sampling step (which
# holds the R2 secrets) skips every tier whose output already exists and publishes the rest,
# top10k then top100k. A failed check fails the job; the next cron retries/resumes.
# Free public FPL API only, sequential, <= 4 requests/s.
#
# `publish` defaults to false: a dry run that fetches, checks (split-half) and
# logs, but writes only to the runner's disk. publish=true writes
# eo/{season}/gw{N}/top10k.json to R2; the writer refuses any key outside
# {OWNED_STORE_R2_PREFIX}eo/. The secret NAMES below are the existing R2 ones.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season key; blank = the registry's current_season"
        required: false
      gw:
        description: "Gameweek; blank = latest with a passed deadline"
        required: false
      tier:
        description: "Tier to sample"
        type: choice
        options: [top10k, top100k]
        default: top10k
      publish:
        description: "Write the result to R2 (false = dry run)"
        type: boolean
        default: false

concurrency:
  group: eo-top10k
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install boto3 pyyaml

      - name: Resolve season
        id: season
        run: |
          KEY="${{ github.event.inputs.season }}"  # empty on schedule
          if [ -z "$KEY" ]; then
            KEY=$(python scripts/tier_eo_top10k.py --print-season)
          fi
          if [ -z "$KEY" ]; then
            echo "season is empty" >&2
            exit 1
          fi
          echo "season=$KEY" >> "$GITHUB_OUTPUT"

      - name: Gate (scheduled runs; public bootstrap only, no credentials in the environment)
        id: gate
        if: ${{ github.event_name == 'schedule' }}
        env:
          SEASON: ${{ steps.season.outputs.season }}
        run: |
          GW=$(python scripts/tier_eo_top10k.py --season "$SEASON" --gate-gw)
          echo "gw=$GW" >> "$GITHUB_OUTPUT"
          if [ -z "$GW" ]; then echo "no settled gameweek: nothing to do"; fi

      - name: Sample the missing tiers and publish to R2 (scheduled)
        if: ${{ github.event_name == 'schedule' && steps.gate.outputs.gw != '' }}
        env:
          SEASON: ${{ steps.season.outputs.season }}
          GW: ${{ steps.gate.outputs.gw }}
          OWNED_STORE_R2_ENDPOINT: ${{ secrets.OWNED_STORE_R2_ENDPOINT }}
          OWNED_STORE_R2_BUCKET: ${{ secrets.OWNED_STORE_R2_BUCKET }}
          OWNED_STORE_R2_ACCESS_KEY_ID: ${{ secrets.OWNED_STORE_R2_ACCESS_KEY_ID }}
          OWNED_STORE_R2_SECRET_ACCESS_KEY: ${{ secrets.OWNED_STORE_R2_SECRET_ACCESS_KEY }}
          OWNED_STORE_R2_PREFIX: ${{ secrets.OWNED_STORE_R2_PREFIX }}
        run: python scripts/tier_eo_top10k.py --season "$SEASON" --gw "$GW" --scheduled --publish r2

      - name: Sample the top 10K (dry run, no credentials in the environment)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true' }}
        env:
          SEASON: ${{ steps.season.outputs.season }}
          GW: ${{ github.event.inputs.gw }}
          TIER: ${{ github.event.inputs.tier }}
        run: |
          ARGS="--season $SEASON --tier ${TIER:-top10k} --out-dir eo_out"
          if [ -n "$GW" ]; then ARGS="$ARGS --gw $GW"; fi
          python scripts/tier_eo_top10k.py $ARGS

      - name: Sample the top 10K and publish to R2
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
        env:
          SEASON: ${{ steps.season.outputs.season }}
          GW: ${{ github.event.inputs.gw }}
          TIER: ${{ github.event.inputs.tier }}
          OWNED_STORE_R2_ENDPOINT: ${{ secrets.OWNED_STORE_R2_ENDPOINT }}
          OWNED_STORE_R2_BUCKET: ${{ secrets.OWNED_STORE_R2_BUCKET }}
          OWNED_STORE_R2_ACCESS_KEY_ID: ${{ secrets.OWNED_STORE_R2_ACCESS_KEY_ID }}
          OWNED_STORE_R2_SECRET_ACCESS_KEY: ${{ secrets.OWNED_STORE_R2_SECRET_ACCESS_KEY }}
          OWNED_STORE_R2_PREFIX: ${{ secrets.OWNED_STORE_R2_PREFIX }}
        run: |
          ARGS="--season $SEASON --tier ${TIER:-top10k} --publish r2"
          if [ -n "$GW" ]; then ARGS="$ARGS --gw $GW"; fi
          python scripts/tier_eo_top10k.py $ARGS
