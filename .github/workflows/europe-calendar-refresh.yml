name: Europe-Calendar Refresh

# UCL / UEL / UECL calendar from StrikerAPI -> one private R2 object the server reads when
# FPL_EUROPE_CALENDAR_STRIKERAPI is on. About 6 credits a run (ceiling 20), from the monthly
# allowance it SHARES with the zonal shots job (tactical-store-refresh.yml); both ask
# fpl_tactical/strikerapi_budget.py before buying.
#
# DORMANT BY DEFAULT. The schedule does nothing until the repository variable
# EUROPE_CALENDAR_ENABLED is "true": publishing to R2 is the operator's decision.
# A manual run (workflow_dispatch) is that decision, taken once.

on:
  schedule:
    # Monday, and the morning after European matchdays (Tue, Wed, Thu nights).
    - cron: "15 7 * * 1,3,4,5"
  workflow_dispatch:
    inputs:
      max_credits:
        description: "Run ceiling in credits"
        required: false
        default: "20"

concurrency:
  group: europe-calendar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.EUROPE_CALENDAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pandas pyarrow boto3 pyyaml

      - name: Resolve season
        run: |
          SEASON="$(python -c "import sys; sys.path.insert(0, 'packages/fpl-data-core'); from fpl_data_core.season_registry import CURRENT_SEASON; print(CURRENT_SEASON)")"
          echo "SEASON=$SEASON" >> "$GITHUB_ENV"

      - name: Refresh and publish the European calendar
        env:
          PYTHONPATH: packages/fpl-tactical:packages/football-intelligence:packages/football-data-contract:packages/fpl-data-core
          STRIKERAPI_KEY: ${{ secrets.STRIKERAPI_KEY }}
          OWNED_STORE_R2_ENDPOINT: ${{ secrets.OWNED_STORE_R2_ENDPOINT }}
          OWNED_STORE_R2_BUCKET: ${{ secrets.OWNED_STORE_R2_BUCKET }}
          OWNED_STORE_R2_ACCESS_KEY_ID: ${{ secrets.OWNED_STORE_R2_ACCESS_KEY_ID }}
          OWNED_STORE_R2_SECRET_ACCESS_KEY: ${{ secrets.OWNED_STORE_R2_SECRET_ACCESS_KEY }}
          OWNED_STORE_R2_PREFIX: ${{ secrets.OWNED_STORE_R2_PREFIX }}
          MAX_CREDITS: ${{ github.event.inputs.max_credits || '20' }}
        # The output is counts, bounds and alerts only: no match rows (the repository is public).
        run: |
          python -m fpl_tactical.cli europe-calendar --season "$SEASON" --require-r2 --publish --max-credits "$MAX_CREDITS"
