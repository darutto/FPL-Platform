name: Owned-Store Refresh

on:
  # History:
  # - PAUSED 2026-09-06: this refresh had been silently overwriting the
  #   2025-2026 season table with live 2026-2027 data every Monday since
  #   2026-07-27 (season key never advanced past the hardcoded 2025-2026 in
  #   this file, paths.py, and season_registry.py).
  # - The season key became a single source of truth (resolved below from
  #   fpl_data_core.season_registry) and capture() started rejecting instead
  #   of writing when the live API disagrees with it
  #   (fpl_historical.season_guard) -- the guard that was missing during the
  #   incident. The schedule stayed commented out regardless, pending a
  #   deliberate decision to actually rotate the key.
  # - REACTIVATED 2026-09-10 (i73 Entrega 2, board card i73): current_season
  #   bumped to 2026-2027 (#241) with data already seeded in R2 for both the
  #   owned and tactical stores, and a redeploy verified in production
  #   (/version, /healthz season on both stores, R2 shape via
  #   inspect-r2-stores.yml) before this schedule was uncommented. See the
  #   PR for the full verification report.
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC, weekly
  workflow_dispatch:        # manual trigger via `gh workflow run owned-store-refresh.yml`
    inputs:
      season:
        # Backfill valve. Blank (the cron/normal case) = the registry's
        # current_season. A non-blank value captures that season instead --
        # used to seed a season the store does not hold yet, ahead of the
        # rollover that moves current_season onto it. The capture guard
        # still has the final say: it refuses unless the season asked for
        # is the one the live FPL API is actually serving.
        description: "Season key override; blank = the registry's current_season"
        required: false

concurrency:
  group: owned-store-refresh
  cancel-in-progress: false  # never cancel an in-flight refresh; let it finish

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install \
            -r packages/fpl-grounded-assistant/requirements.txt \
            pyarrow \
            pandas \
            pyyaml

      # Single source of truth for "which season is current" is
      # packages/fpl-data-core/season_registry.yaml (current_season key).
      # Resolving it here (rather than hardcoding --season below) means this
      # workflow can no longer drift from that value on its own — see
      # incident writeup in the PR for why that drift mattered.
      #
      # IS_CURRENT_SEASON records whether this run targets the season the
      # serving deployment actually reads. A backfill run for any other
      # season publishes to that season's own R2 prefix and stops there:
      # redeploying and asserting /healthz would be asserting against a
      # pointer production never loads.
      - name: Resolve season
        env:
          INPUT_SEASON: ${{ github.event.inputs.season }}
        run: |
          REGISTRY_SEASON="$(python -c "import sys; sys.path.insert(0, 'packages/fpl-data-core'); from fpl_data_core.season_registry import CURRENT_SEASON; print(CURRENT_SEASON)")"
          SEASON="${INPUT_SEASON:-$REGISTRY_SEASON}"
          echo "SEASON=$SEASON" >> "$GITHUB_ENV"
          if [ "$SEASON" = "$REGISTRY_SEASON" ]; then
            echo "IS_CURRENT_SEASON=true" >> "$GITHUB_ENV"
          else
            echo "IS_CURRENT_SEASON=false" >> "$GITHUB_ENV"
            echo "::notice::Backfill run for $SEASON (registry current_season is $REGISTRY_SEASON): publishing to R2 only, skipping Railway redeploy and /healthz verification."
          fi

      # Decision 2 (§4): no --skip-if-fresh flag.
      # The GHA runner is ephemeral — its local disk is always empty, so the
      # local-freshness check would never fire. Passing the flag would be
      # misleading. Always run a full capture.
      #
      # capture() now rejects (writes nothing) if the live FPL bootstrap's
      # season doesn't match $SEASON — see fpl_historical.season_guard. This
      # is the guard that was missing during the 2026-07-27..2026-08-31
      # incident; it does not require any change here beyond passing the
      # resolved $SEASON through.
      - name: Capture FPL data (full baseline)
        run: bash packages/fpl-historical/capture.sh capture --season "$SEASON"

      - name: Merge owned store
        run: bash packages/fpl-historical/capture.sh merge --season "$SEASON"

      - name: Extract merged_at from pointer file
        id: extract
        run: |
          echo "merged_at=$(jq -r .merged_at packages/fpl-historical/data/historical/seasons/$SEASON/_owned_latest.json)" >> "$GITHUB_OUTPUT"

      - name: Publish to R2
        env:
          OWNED_STORE_R2_ENDPOINT: ${{ secrets.OWNED_STORE_R2_ENDPOINT }}
          OWNED_STORE_R2_BUCKET: ${{ secrets.OWNED_STORE_R2_BUCKET }}
          OWNED_STORE_R2_ACCESS_KEY_ID: ${{ secrets.OWNED_STORE_R2_ACCESS_KEY_ID }}
          OWNED_STORE_R2_SECRET_ACCESS_KEY: ${{ secrets.OWNED_STORE_R2_SECRET_ACCESS_KEY }}
        run: |
          python packages/fpl-grounded-assistant/fpl_grounded_assistant/owned_store_sync.py publish --season "$SEASON"

      - name: Redeploy Railway service
        if: env.IS_CURRENT_SEASON == 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          python packages/fpl-grounded-assistant/fpl_grounded_assistant/railway_redeploy.py

      # Decision 3 (§4): if: always() so this step runs even when the redeploy
      # step failed. A Railway redeploy call can time out or return a transient
      # 502 while the deployment actually proceeds; the /healthz poll is the
      # authoritative source of truth for whether the snapshot landed. The
      # overall workflow still exits non-zero if any earlier required step
      # failed; this step's result is informational on the redeploy-failure path.
      # --expected-season makes this the season-rollover invariant: without it,
      # a match only proved a timestamp moved, never that production is
      # actually serving $SEASON for either store (i73 Entrega 2).
      - name: Verify /healthz reports updated merged_at
        if: always() && env.IS_CURRENT_SEASON == 'true'
        run: |
          python packages/fpl-grounded-assistant/scripts/verify_healthz_merged_at.py \
            --url "${{ secrets.RAILWAY_HEALTHZ_URL }}" \
            --expected-merged-at "${{ steps.extract.outputs.merged_at }}" \
            --expected-season "$SEASON" \
            --timeout 900 \
            --interval 30
