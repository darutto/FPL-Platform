# package-test-suites.yml
# ========================
# Runs each package's own pytest suite, in that package's own directory.
#
# WHY THIS EXISTS
# ---------------
# Until 2026-08-05 no CI job ran pytest against these packages at all. As a
# result, fpl-tool-contract sat at 39 failures and fpl-tool-runner was dead at
# collection for an extended period without anyone noticing -- both caused by a
# single wrong `pythonpath` entry in their pytest.ini files (PR #66). A fourth
# pre-existing failure (test_owned_store_fallback) had been invisible on Windows
# because the tmp_path fixture errors with PermissionError before reaching the
# assertion; this job surfaced it on Linux.
#
# DESIGN RULE -- DO NOT ADD A PYTHONPATH ENV VAR HERE
# ---------------------------------------------------
# Each step cds into its package and runs bare pytest, letting that package's
# pytest.ini `pythonpath` resolve imports. That is deliberate: this job's purpose
# is to protect the pytest.ini wiring, so it must consume that wiring rather than
# restate it. A hand-maintained PYTHONPATH (as in contract-drift-gate.yml) would
# let this job go green while the pytest.ini it is supposed to guard is broken --
# precisely the drift that produced the bug this job exists to catch.
#
# DESIGN RULE -- STABLE JOB NAMES, NO MATRIX
# -------------------------------------------
# Branch protection matches required checks by job name, and renaming a required
# check silently un-requires it. A matrix would emit one name per package, all
# of which change when the package list changes; a fixed job emits one stable
# name that is safe to wire into protection.
#
# There are now two jobs -- `Package test suites` and `Falsifiability probe` --
# because they answer different questions at wildly different speeds, not
# because the list grew. Both names are protection contexts. Adding a job here
# does not add protection: the context must be added to the required list by
# hand, and there is an unavoidable window between merging a new job and
# requiring it, during which it runs but blocks nothing. Do not add a required
# context before the job producing it exists on main -- nothing could merge,
# including the PR that creates it.
#
# DESIGN RULE -- NO `paths:` FILTER
# ---------------------------------
# Deliberately runs on every PR. A required check that never runs never reports,
# and GitHub blocks the PR forever waiting for it -- a doc-only PR (like #64,
# which touched one markdown file) would hang.
#
# COST, MEASURED -- this argument used to end "the suites take ~30-40s total, so
# always running is cheaper than engineering around that trap." The first half
# was true and the conclusion had stopped following: the suites were ~25s but the
# falsifiability probe was 32m06s, so every PR paid ~33 min for this one check.
#
# The probe now lives in its own job (see `falsifiability-probe` below), so this
# job reports in ~115s. That does NOT make a PR cheaper -- the probe still gates
# for ~32 min on its own check -- it makes a *failing suite* visible in ~2 min
# instead of 33, which is the cost that kept being paid in practice.
#
# So for THIS job the original argument holds again on current numbers: 115s is
# cheap enough that always running beats engineering around the never-reports
# trap. For the probe job the `paths:` question is still open and still has the
# skipped-required-check hazard (a required check that is skipped never reports,
# and GitHub blocks the merge). Recorded in
# field-notes/2026-08-14-pr62-instrument-gaps.md finding 2. Anyone re-opening it
# should decide on measured numbers, not inherited ones.
#
# Complements contract-drift-gate.yml, which runs the deterministic
# run_phase_*.py contract checkers rather than the pytest suites.

name: Package Test Suites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    # This name is the required-check string. Do not rename casually.
    name: Package test suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No package in this monorepo ships pyproject.toml/setup.py, so there is
      # nothing to pip-install as a package. fpl-grounded-assistant's
      # requirements.txt is the dependency superset for all three suites;
      # fpl-tool-contract and fpl-tool-runner have no requirements file of their
      # own but import the same third-party libraries transitively.
      - name: Install dependencies
        run: pip install --no-cache-dir -r packages/fpl-grounded-assistant/requirements.txt pytest==9.1.1

      # `if: '!cancelled()'` on the later steps so one failing suite still lets
      # the others report -- the same benefit the previous matrix got from
      # fail-fast: false.
      # Leaf package -- no intra-repo dependencies, so it runs first.
      - name: fpl-captain-engine suite
        working-directory: packages/fpl-captain-engine
        run: python -m pytest -v

      - name: fpl-tool-contract suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-tool-contract
        run: python -m pytest -v

      - name: fpl-tool-runner suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-tool-runner
        run: python -m pytest -v

      - name: fpl-grounded-assistant suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-grounded-assistant
        run: python -m pytest -v

      # ---------------------------------------------------------------------
      # Added by #72 phase 1 -- six packages that were in no CI job at all.
      #
      # All ten remaining unrun suites were measured before wiring any of them;
      # five were already green and one (fpl-api-client) was red only on a
      # stale pin, fixed in this same PR. The other four reds and the one
      # unmeasured slow suite are deliberately NOT here -- see the phase notes
      # at the bottom of this file.
      #
      # Each step records the baseline at the time of wiring, the convention
      # FI-8 S0 set below: without it, nobody can later tell whether a changed
      # number is growth or loss.
      #
      # No extra install line is needed for any of these. pandas / pyarrow /
      # PyYAML / requests are already in the grounded-assistant requirements
      # superset installed above. fpl-tactical lists soccerdata, but that is a
      # build-time dependency its suite does not use -- verified by running the
      # suite with soccerdata blocked from sys.meta_path: identical result.
      # ---------------------------------------------------------------------

      # No runtime dependencies at all (FI-0(b) scaffold).
      # Baseline at the time of wiring: 76 passed.
      - name: football-data-contract suite
        if: ${{ !cancelled() }}
        working-directory: packages/football-data-contract
        run: python -m pytest -v

      # Wired in this phase rather than a later one because #62 just made six
      # grounded-assistant modules delegate their current-GW resolution here:
      # this is the package with the widest blast radius and, until now, the
      # least protection. Its one failure was `test_only_bootstrap_surface_in_all`,
      # an exact-set `__all__` pin that went red when the preseason reweight
      # (b3e8842, 2026-08-09) exported `is_form_informative` -- red for five days
      # with nothing to report it. Pin updated in this PR; the assertion stays
      # exact rather than being loosened to a subset.
      # Baseline at the time of wiring: 38 passed.
      - name: fpl-api-client suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-api-client
        run: python -m pytest -v

      # NOTE: the only package here with no pytest.ini -- its single test file
      # bootstraps sys.path itself. That works, but it is the same
      # wiring-restated-in-the-guarded-thing pattern this job exists to catch,
      # so it should grow a pytest.ini like its siblings. Left as follow-up
      # rather than folded in silently; wiring it green now is still strictly
      # better than leaving it unrun.
      # Baseline at the time of wiring: 4 passed.
      - name: fpl-pipeline suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-pipeline
        run: python -m pytest -v

      # Baseline at the time of wiring: 19 passed.
      - name: fpl-tactical suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-tactical
        run: python -m pytest -v

      # Two tests in TestRealSeasonSanity read the owned parquet store under
      # data/, which is gitignored -- captured output, not source. They passed
      # locally only because the author's machine had a captured store; on a
      # clean checkout they raised FileNotFoundError. Found by this very PR's
      # first CI run, which is the point of the issue. They are now skipped when
      # the store is absent, with a named reason: NOT rewritten onto synthetic
      # frames, which would delete what they check.
      # Read the baseline accordingly -- in CI those two are skipped, so their
      # real coverage exists only where the store does, and a green run here is
      # not evidence they passed.
      # Baseline at the time of wiring: 112 passed, 2 skipped (114 passed with a
      # local store present).
      - name: fpl-historical suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-historical
        run: python -m pytest -v

      # Slowest of the six at ~39s locally; still cheap next to the probe below.
      # Baseline at the time of wiring: 40 passed.
      - name: football-identity-registry suite
        if: ${{ !cancelled() }}
        working-directory: packages/football-identity-registry
        run: python -m pytest -v

      # Added by #72 phase 2. Its two failures were a real defect, not a stale
      # pin: lookup_by_web_name answered ambiguous web_names with the
      # highest-owned candidate instead of None. Four independent witnesses
      # said None (its own docstring, two tests, the standalone phase-1d
      # runner) and only the implementation disagreed -- the opposite of
      # fpl-api-client, where the pin was the stale one. Fixed in source.
      # Baseline at the time of wiring: 50 passed (47 + 3 new regressions).
      - name: fpl-player-registry suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-player-registry
        run: python -m pytest -v

      # Added by #72 phase 2b. Its single failure was a composition defect, not
      # a stale pin and not downstream of phase 2a: each registry lookup behaves
      # as documented, but chaining them re-answered the ambiguous question the
      # web_name step had correctly declined. Fixed in source.
      # Baseline at the time of wiring: 42 passed (40 + 2 new regressions).
      - name: fpl-query-tools suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-query-tools
        run: python -m pytest -v

      # Added by #72 phase 2c. Its two failures were two different things, which
      # is the whole argument for diagnosing per failure rather than per package:
      # one stale pin (CUMULATIVE_COLS 26 -> 30, four 2025-26 defensive stats
      # added by ab32cc6) and one Windows-only artifact that would have passed
      # here untouched (a Path compared as a substring of str(), so the host
      # separator decided the result). The second is the reverse-direction case
      # the phase rule exists for -- a local red that is not a CI red.
      # The 7 skips are data-conditional and already carry named reasons.
      # Baseline at the time of wiring: 63 passed, 7 skipped.
      - name: fpl-data-core suite
        if: ${{ !cancelled() }}
        working-directory: packages/fpl-data-core
        run: python -m pytest -v

      # Added by #72 phase 3 -- the last unwired package, and the one that
      # completes coverage at 15/15.
      #
      # It was held back as a "CI-budget decision" while its cost was unknown.
      # Measured: it is green, not red -- there was never a red suite here, only
      # an unmeasured one.
      #
      # Cost on its own axis rather than the flattering fraction (job 94955321412):
      # this step is 69s, and it takes all suites from ~46s to 115s -- 2.5x, with
      # football-intelligence alone being ~60% of the new total. Against the 32m
      # probe below that is ~5% of the job, but the probe is the thing to fix,
      # not a licence to grow the suites for free.
      #
      # No install line needed. Its requirements are pandas / pyarrow / boto3,
      # all already in the grounded-assistant superset installed above --
      # verified by scanning every import in the package and its tests, not by
      # reading the requirements file. (Unlike fpl-tactical, whose case was the
      # inverse: a listed dependency its suite does not use.)
      #
      # Baseline at the time of wiring: 391 passed.
      # NOT the local figure. Locally this reads 389 passed / 2 skipped -- the
      # two skips are "symlink creation unavailable", a Windows privilege
      # limitation, and both tests run here. Local undercounts; trust this line.
      - name: football-intelligence suite
        if: ${{ !cancelled() }}
        working-directory: packages/football-intelligence
        run: python -m pytest -v

      # Added by FI-8 S0. FI-8 adds twelve files to this package; until now no
      # CI job ran its suite, which is the same shape that left
      # fpl-tool-contract at 39 silent failures and fpl-tool-runner dead at
      # collection. Baseline at the time of wiring: 67 passed. Its only
      # dependency is requests>=2.31, already satisfied by the requests==2.32.5
      # pinned in the install step above -- no second install line is needed.
      - name: sportmonks-client suite
        if: ${{ !cancelled() }}
        working-directory: packages/sportmonks-client
        run: python -m pytest -v

  # ==========================================================================
  # Falsifiability probe -- its own job, running in PARALLEL with the suites.
  #
  # WHY IT IS NOT A STEP OF `pytest` ANY MORE
  # -----------------------------------------
  # It used to be the last step of that job. Splitting does NOT reduce wall
  # clock -- the probe is ~32 min either way, and it is what a PR waits on.
  # It reduces *feedback latency*, which is the thing that actually kept
  # biting: GitHub does not serve a job's logs until the whole job finishes,
  # so while the probe ran, a failing suite was invisible for half an hour
  # even though it had failed in the first two minutes.
  #
  # Measured cost of that, during #72 alone: a fpl-historical failure took
  # 32 min to become readable; reading one number out of a 69s step took
  # another 32; and it did it twice more across the phase-2 rebases. After
  # this split the suites report in ~115s, on their own check.
  #
  # WHAT IT DOES NOT FIX
  # --------------------
  # A PR is still blocked for ~33 min by this job. Making *that* cheaper is a
  # different change (parallelise the sweep across its scripts, or a `paths:`
  # filter) with different trade-offs, and neither is this PR.
  #
  # CLEAN-TREE PRECONDITION -- STRICTLY BETTER HERE
  # -----------------------------------------------
  # require_clean_tree() refuses to sweep when tracked files under
  # packages/sportmonks-client are dirty, at both ends of the sweep. In its own
  # job it runs on a fresh checkout with nothing before it, instead of after
  # fifteen pytest suites. That can only make the precondition easier to hold,
  # never harder -- untracked residue like .pytest_cache was already permitted
  # (`--untracked-files=no`), so nothing that used to pass now fails.
  #
  # The duplicated checkout + Python setup costs no wall clock: this job runs
  # concurrently with `pytest`, and both are far shorter than the sweep.
  #
  # The install line is deliberately IDENTICAL to the one in `pytest` rather
  # than a minimal pytest+requests pair. The probe shells out to
  # `python -m pytest` over the sportmonks-client suite, so it needs whatever
  # that suite needs -- and a second, hand-trimmed dependency list is exactly
  # the kind of restated wiring that drifts out of sync with the thing it
  # mirrors. One source of truth, even at the cost of installing more than
  # this job strictly uses.
  #
  # NOTE: `falsifiability_probe.py` itself is untouched by this change. This is
  # workflow configuration only; the instrument freeze (580b278) stands.
  # ==========================================================================
  falsifiability-probe:
    # This name becomes a status-check context. Adding it to branch protection
    # is a separate, manual step -- see the #72 notes at the bottom of the file.
    name: Falsifiability probe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --no-cache-dir -r packages/fpl-grounded-assistant/requirements.txt pytest==9.1.1

      # The falsifiability gate. Every mitigation this phase produced for
      # unfalsifiable reported values was a *rule*, and the measured result is
      # that rules about sweeping fail under the most favourable conditions
      # available: the author of the sweep rule, in the commit introducing it,
      # in a 218-line file, applied it to one site of six. This runs the
      # experiment instead of asking someone to remember it.
      #
      # It runs here rather than only locally because the runner is a different
      # platform and keeps falsifying assumptions a local run cannot see -- the
      # ignore assertion in #94 passed locally and failed here, because
      # `git status --ignored` lists only paths that exist and the local machine
      # happened to have them.
      - name: sportmonks-client falsifiability probe
        working-directory: packages/sportmonks-client
        run: |
          python scripts/falsifiability_probe.py \
            --file scripts/trial_auth.py \
            --file scripts/trial_entities.py \
            --file scripts/trial_fixtures.py \
            --file scripts/trial_injuries.py \
            --file scripts/trial_lineups.py \
            --file scripts/trial_mapping.py \
            --file scripts/trial_squads.py \
            --subject "../../.gitignore::downloaded_files/" \
            --subject "../../.gitignore::packages/sportmonks-client/trial-output/" \
            --positive-control "scripts/trial_auth.py::exchanges[-1].body_keys::exchanges[0].body_keys" \
            --basetemp-root "${RUNNER_TEMP}/probe"

# ============================================================================
# #72 ONBOARDING -- CLOSED AT 15/15
# ============================================================================
# All fifteen test-bearing packages now run here. #72 is closed (2026-08-15).
# Kept because the reasoning is worth more than the status:
#
# Onboarding found eight problems and NO TWO WERE THE SAME KIND:
#   - two stale exact-value pins   (fpl-api-client __all__, fpl-data-core count)
#   - two real defects             (player-registry ambiguity; query-tools
#                                   composition -- every lookup correct, the
#                                   chain wrong)
#   - one that was never a failure (fpl-data-core compared a Path as a substring
#                                   of str(), so the host separator decided it;
#                                   red on Windows, green here untouched)
#   - two green only for their author (fpl-historical read a gitignored parquet
#                                   store, so they passed on any machine that
#                                   had run a capture and nowhere else)
#
# ab32cc6 alone accounts for three of those, in three different packages, with
# zero signal for months -- because none of the three had a job. That is the
# measured cost of the thing this file exists to prevent.
#
# RULES THAT CAME OUT OF IT
#   - A local `N passed` is not evidence about CI, in EITHER direction. Windows
#     `PermissionError: [WinError 5]` on the pytest temp dir and "symlink
#     creation unavailable" both make it UNDERCOUNT (fpl-tactical reads 12+7
#     errors locally, 19 here; football-intelligence reads 389+2 skipped
#     locally, 391 here). A gitignored data dependency makes it OVERCOUNT
#     (fpl-historical). Reconcile before believing a local number.
#   - Never loosen an assertion into a tautology to get green. Exact pins were
#     updated to exact pins with provenance recorded, never relaxed to `>=`.
#   - A skipped test protects nothing. If one genuinely cannot run without local
#     data, skip with a named reason AND say so wherever coverage is claimed.
#   - Validate edits to this file against the Actions schema, not YAML syntax.
#     A step missing `run:` is valid YAML and invalid Actions; GitHub then names
#     the run after the FILE instead of the job and executes nothing. That cost
#     a full 33-minute cycle during phase 2. Assert every step has run: or uses:.
#   - Stacked PRs always conflict here, because every new suite step lands at
#     the same point and the shared trailing `run:` line sits on the far side of
#     the conflict marker. "Keep both hunks" silently drops it from the first
#     step. That is how the above happened.
#
# STILL OPEN
#   Making a PR cheaper, as opposed to making failures visible sooner. The
#   probe job gates for ~32 min on every PR including doc-only ones. Options
#   are parallelising the sweep across its scripts, or a `paths:` filter -- the
#   latter still carrying the hazard that a SKIPPED required check never
#   reports, so GitHub blocks the merge forever. Decide on measured numbers.
