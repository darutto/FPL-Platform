name: Tactical-Store Refresh

# Zonal shots come from StrikerAPI. Daily, after the source's own refresh
# (10:00 UTC). The job reads FPL's public fixtures first; on a day with no
# match due (finished and >= 36 h past full time, not yet stored) it makes no
# call to the source and spends no credits.
#
# The Understat next-season probe (i77) no longer lives here: this job does not
# wait on Understat, and a probe hidden behind continue-on-error would be
# green noise. Nothing read its step outputs.

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season key override; blank = the registry's current_season"
        required: false
      max_credits:
        description: "Hard credit ceiling for this run"
        required: false
        default: "130"

concurrency:
  group: tactical-store-refresh
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: packages/fpl-tactical
      OWNED_STORE_R2_ENDPOINT: ${{ secrets.OWNED_STORE_R2_ENDPOINT }}
      OWNED_STORE_R2_BUCKET: ${{ secrets.OWNED_STORE_R2_BUCKET }}
      OWNED_STORE_R2_ACCESS_KEY_ID: ${{ secrets.OWNED_STORE_R2_ACCESS_KEY_ID }}
      OWNED_STORE_R2_SECRET_ACCESS_KEY: ${{ secrets.OWNED_STORE_R2_SECRET_ACCESS_KEY }}
      OWNED_STORE_R2_PREFIX: ${{ secrets.OWNED_STORE_R2_PREFIX }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r packages/fpl-tactical/requirements.txt boto3

      # Single source of truth for "which season is current" is
      # packages/fpl-data-core/season_registry.yaml, as in owned-store-refresh.yml.
      - name: Resolve season
        env:
          INPUT_SEASON: ${{ github.event.inputs.season }}
        run: |
          REGISTRY_SEASON="$(python -c "import sys; sys.path.insert(0, 'packages/fpl-data-core'); from fpl_data_core.season_registry import CURRENT_SEASON; print(CURRENT_SEASON)")"
          echo "SEASON=${INPUT_SEASON:-$REGISTRY_SEASON}" >> "$GITHUB_ENV"

      # The runner starts empty: restore the StrikerAPI working store first.
      # The first load (202 credits) is a separate, manual command and has to
      # exist on R2 before this job can do anything.
      - name: Restore the working store from R2
        run: |
          python -m fpl_tactical.publish fetch --season "$SEASON" --source strikerapi

      # Exit codes of strikerapi-sync: 0 ok or nothing due, 1 failed (nothing
      # published), 3 refused (credits), 4 stored fine but a due match has been
      # missing from the source for 3+ days. 4 still publishes what is valid
      # and then opens the issue; every other non-zero fails the job.
      - name: Sync what is due
        id: sync
        env:
          STRIKERAPI_KEY: ${{ secrets.STRIKERAPI_KEY }}
          MAX_CREDITS: ${{ github.event.inputs.max_credits || '130' }}
        run: |
          set +e
          python -m fpl_tactical.cli strikerapi-sync --season "$SEASON" --max-credits "$MAX_CREDITS" | tee sync.json
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if grep -q '"action": "synced"' sync.json; then echo "synced=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 4 ]; then exit "$code"; fi

      - name: Verify store
        if: steps.sync.outputs.synced == 'true'
        run: |
          python packages/fpl-tactical/scripts/verify_strikerapi_store.py --season "$SEASON"

      - name: Publish to R2
        if: steps.sync.outputs.synced == 'true'
        run: |
          python -m fpl_tactical.publish publish --season "$SEASON" --source strikerapi

      - name: Open or refresh the issue
        if: failure() || steps.sync.outputs.code == '4'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python packages/fpl-tactical/scripts/open_source_issue.py --detail "The daily shot refresh failed, or a finished match is missing from the source."
