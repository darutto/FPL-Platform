name: Tactical-Store Refresh

# Zonal shots come from StrikerAPI. Daily, after the source's own refresh
# (10:00 UTC). The job reads FPL's public fixtures first; on a day with no
# match due (finished and >= 36 h past full time, not yet stored) it makes no
# call to the source and spends no credits.
#
# GO-LIVE GATE. The schedule does nothing (a notice; no call, no issue) until
# the repository variable TACTICAL_SHOTS_SOURCE is set to `strikerapi`. A
# manual run (workflow_dispatch) always works: that is how the first load
# (mode: first-load) and a manual sync happen. Order:
#   1. secret STRIKERAPI_KEY
#   2. manual run, mode first-load
#   3. compare answers on the local stack
#   4. set the repository variable TACTICAL_SHOTS_SOURCE=strikerapi
#   5. Railway: TACTICAL_SHOTS_SOURCE=strikerapi
# From step 4 on, a missing working store on R2 is a real failure (issue).
#
# Never pay twice: every paid response is kept on R2 (private `strikerapi/raw/`)
# before it is read, and a kept match is never fetched again.
#
# The Understat next-season probe (i77) no longer lives here: this job does not
# wait on Understat, and a probe hidden behind continue-on-error would be
# green noise. Nothing read its step outputs.

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = fetch what is due; first-load = whole season, once (202 credits)"
        type: choice
        options: [sync, first-load]
        default: sync
      season:
        description: "Season key override; blank = the registry's current_season"
        required: false
      max_credits:
        description: "Hard credit ceiling for a sync run (the first load has its own: 202)"
        required: false
        default: "130"

concurrency:
  group: tactical-store-refresh
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  waiting:
    if: "!(github.event_name == 'workflow_dispatch' || vars.TACTICAL_SHOTS_SOURCE == 'strikerapi')"
    runs-on: ubuntu-latest
    steps:
      - name: Not live yet
        run: |
          echo "::notice::Shot refresh not live yet: set the repository variable TACTICAL_SHOTS_SOURCE=strikerapi after the first load."

  refresh:
    if: "github.event_name == 'workflow_dispatch' || vars.TACTICAL_SHOTS_SOURCE == 'strikerapi'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event.inputs.mode || 'sync' }}
      PYTHONPATH: packages/fpl-tactical
      OWNED_STORE_R2_ENDPOINT: ${{ secrets.OWNED_STORE_R2_ENDPOINT }}
      OWNED_STORE_R2_BUCKET: ${{ secrets.OWNED_STORE_R2_BUCKET }}
      OWNED_STORE_R2_ACCESS_KEY_ID: ${{ secrets.OWNED_STORE_R2_ACCESS_KEY_ID }}
      OWNED_STORE_R2_SECRET_ACCESS_KEY: ${{ secrets.OWNED_STORE_R2_SECRET_ACCESS_KEY }}
      OWNED_STORE_R2_PREFIX: ${{ secrets.OWNED_STORE_R2_PREFIX }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r packages/fpl-tactical/requirements.txt boto3

      # Single source of truth for "which season is current" is
      # packages/fpl-data-core/season_registry.yaml, as in owned-store-refresh.yml.
      - name: Resolve season
        env:
          INPUT_SEASON: ${{ github.event.inputs.season }}
        run: |
          REGISTRY_SEASON="$(python -c "import sys; sys.path.insert(0, 'packages/fpl-data-core'); from fpl_data_core.season_registry import CURRENT_SEASON; print(CURRENT_SEASON)")"
          echo "SEASON=${INPUT_SEASON:-$REGISTRY_SEASON}" >> "$GITHUB_ENV"

      # The first load (202 credits) only ever runs by hand. Its reference is
      # the other source's rows for this season, restored from their untouched
      # R2 keys. A run that fails a check keeps its paid responses, so running
      # it again costs nothing for them.
      - name: Restore the reference rows for the first load
        if: env.MODE == 'first-load'
        env:
          TACTICAL_SHOTS_SOURCE: understat
        run: |
          python -m fpl_tactical.publish sync --season "$SEASON"

      - name: First load (202 credits, manual)
        id: load
        if: env.MODE == 'first-load'
        env:
          STRIKERAPI_KEY: ${{ secrets.STRIKERAPI_KEY }}
        run: |
          python -m fpl_tactical.cli strikerapi-load --season "$SEASON" --require-r2 --yes-spend-credits --backup-parquet "packages/fpl-tactical/data/tactical/seasons/$SEASON/understat_shots.parquet"
          echo "synced=true" >> "$GITHUB_OUTPUT"

      # The runner starts empty: restore the StrikerAPI working store first.
      - name: Restore the working store from R2
        if: env.MODE == 'sync'
        run: |
          python -m fpl_tactical.publish fetch --season "$SEASON" --source strikerapi

      # Exit codes of strikerapi-sync: 0 ok or nothing due, 1 failed (nothing
      # published), 3 refused (credits), 4 stored fine but a due match has been
      # missing from the source for 3+ days. 4 still publishes what is valid
      # and then opens the issue; every other non-zero fails the job.
      - name: Sync what is due
        id: sync
        if: env.MODE == 'sync'
        env:
          STRIKERAPI_KEY: ${{ secrets.STRIKERAPI_KEY }}
          MAX_CREDITS: ${{ github.event.inputs.max_credits || '130' }}
        run: |
          set +e
          python -m fpl_tactical.cli strikerapi-sync --season "$SEASON" --require-r2 --max-credits "$MAX_CREDITS" | tee sync.json
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if grep -q '"action": "synced"' sync.json; then echo "synced=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 4 ]; then exit "$code"; fi

      - name: Verify store
        if: steps.sync.outputs.synced == 'true' || steps.load.outputs.synced == 'true'
        run: |
          python packages/fpl-tactical/scripts/verify_strikerapi_store.py --season "$SEASON"

      - name: Publish to R2
        if: steps.sync.outputs.synced == 'true' || steps.load.outputs.synced == 'true'
        run: |
          python -m fpl_tactical.publish publish --season "$SEASON" --source strikerapi

      - name: Open or refresh the issue
        if: failure() || steps.sync.outputs.code == '4'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python packages/fpl-tactical/scripts/open_source_issue.py --detail "The daily shot refresh failed, or a finished match is missing from the source."
