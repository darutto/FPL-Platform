name: Verify Railway deploy matches main

# The mechanism assertion for /version (fpl_server.py, added in PR #111
# alongside the fix for 161 consecutive failed Railway deploys). /version
# answers "what commit is actually running" if someone asks it — but for two
# weeks nobody did, across 161 auto-deploy attempts, because /health and
# /ready both kept returning 200 from the last container that HAD started
# successfully. This workflow is the thing that asks, so a future stuck
# deploy fails loudly (this run turns red + an issue opens) instead of
# silently freezing prod on stale code again.
#
# Runs twice: once right after every push to main (fast feedback, tolerant of
# the ~1-3 min Railway build+deploy time via the poll/retry loop below), and
# on a schedule as a standing safety net that isn't tied to any specific push
# — the actual failure mode last time was 161 *separate* deploy attempts
# drifting silently over two weeks, not a single missed check after one merge.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch: {} # manual trigger from the Actions tab

concurrency:
  group: verify-railway-deploy
  cancel-in-progress: true # a newer push supersedes an in-flight check of an older one

permissions:
  contents: read
  issues: write # so a failed run can open/close the "prod is stale" alert issue

env:
  BACKEND_URL: https://fpl-backend-production-4151.up.railway.app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine expected commit (origin/main HEAD)
        id: expected
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Poll /version until it matches, or time out
        id: check
        run: |
          expected="${{ steps.expected.outputs.sha }}"
          echo "Expected commit: $expected"

          # On a push trigger the deploy this push caused may still be
          # building — poll for a few minutes before declaring drift. On a
          # schedule/dispatch trigger there's nothing to wait for; if the
          # first read doesn't match, later ones on the same stale deploy
          # won't either, so fail fast instead of burning the full budget.
          if [ "${{ github.event_name }}" = "push" ]; then
            attempts=20
            sleep_s=30
          else
            attempts=1
            sleep_s=0
          fi

          actual="unreachable"
          for i in $(seq 1 "$attempts"); do
            actual=$(curl -fsS --max-time 15 "$BACKEND_URL/version" | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit','unreachable'))" 2>/dev/null || echo "unreachable")
            echo "Attempt $i/$attempts: live commit = $actual"
            if [ "$actual" = "$expected" ]; then
              break
            fi
            if [ "$i" -lt "$attempts" ]; then
              sleep "$sleep_s"
            fi
          done

          echo "actual=$actual" >> "$GITHUB_OUTPUT"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Live commit ($actual) does not match main HEAD ($expected) after $attempts attempt(s)."
            exit 1
          fi
          echo "Live commit matches main HEAD."

      - name: Open/update alert issue on mismatch
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ fpl-backend on Railway does not match main";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            const body = `/version on the live backend does not match main's HEAD.\n\nFailed run: ${runUrl}\n\nThis is exactly the failure mode that silently froze production for two weeks after PR #45 (161 failed Railway deploys, all served by the last container that HAD started — see field-notes/2026-08-09-railway-deploy-frozen-since-pr45.md). Check the Railway dashboard for the latest deployment's build/deploy logs. This issue auto-closes on the next matching run.`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still mismatched. ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close alert issue once matching again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ fpl-backend on Railway does not match main";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Live commit matches main again — closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
