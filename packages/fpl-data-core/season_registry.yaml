# fpl-data-core · packages/fpl-data-core/season_registry.yaml
# =============================================================
# Canonical season layout registry.
#
# SOURCE:  Extracted and externalised from:
#   - captaincy-ml/ml/data/season_layouts.py  (_initialize_registry, lines 135-178)
#   - captaincy-showdown/src/utils/csvPathConfig.ts  (season-specific path logic)
#
# REPLACES (do NOT delete originals until migration is approved):
#   - captaincy-ml/ml/data/season_layouts.py  hardcoded _initialize_registry block
#   - captaincy-showdown/src/utils/csvPathConfig.ts  season string comparisons
#
# HOW TO ADD A NEW SEASON:
#   1. Add a new entry in the `seasons` list below.
#   2. No Python or TypeScript source changes needed.
#
# current_season IS THE SINGLE SOURCE OF TRUTH for the season key our OWNED
# DATA STORE is currently keyed to (added 2026-09, incident: owned-store-refresh
# silently wrote 2026-2027 data under the 2025-2026 key for six weeks because
# this value was copy-pasted as a literal in six-plus source files with nothing
# checking it against the live FPL API). Every module that needs that key must
# import it from fpl_data_core.season_registry.CURRENT_SEASON instead of
# hardcoding a string. Bump this ONLY as part of an explicit, reviewed
# season-rollover change -- never automatically.
#
# READ THIS BEFORE BUMPING IT. This is NOT "the season football is currently
# playing". Those are two different things and they are routinely divergent:
# as of 2026-09-07 the live FPL API serves 2026-2027, while this value is
# 2025-2026, because 2025-2026 is the newest season we actually hold data for.
# That divergence is correct and expected. Bumping this to match the live
# season does NOT fix anything -- it repoints every read path at a season the
# store has no rows for.
#
# If you want "which season is live right now", derive it from the API:
# fpl_historical.season_guard.derive_live_season(bootstrap). That is what the
# capture guard compares against this value; disagreement is exactly what it
# is built to catch, not a bug to be silenced by editing this line.
#
# KNOWN CONSEQUENCE of the divergence, pre-dating this file's consolidation:
# consumers that compute "the previous season" from this key are off by one
# whenever it lags the live season. Today, "la temporada pasada" resolves to
# 2024-2025 when a user means 2025-2026. Tracked separately -- do not paper
# over it by bumping this value.
# =============================================================

current_season: "2025-2026"

seasons:

  - season: "2024-2025"
    data_root: "data/2024-2025"
    has_consolidated_files: true
    player_id_column: "id"
    gameweek_column: "event"
    gameweek_pattern: "GW{gw}"
    files:
      players:              "players/players.csv"
      playerstats:          "playerstats/playerstats.csv"
      matches:              "matches/matches.csv"
      teams:                "teams/teams.csv"
      playermatchstats:     "playermatchstats/playermatchstats.csv"
      # Per-gameweek patterns — {gw} is replaced with GW{number}
      matches_gw:           "matches/{gw}/matches.csv"
      playermatchstats_gw:  "playermatchstats/{gw}/playermatchstats.csv"

  - season: "2025-2026"
    data_root: "data/2025-2026"
    has_consolidated_files: false
    player_id_column: "id"
    gameweek_column: "gw"
    gameweek_pattern: "GW{gw}"
    files:
      players:              "players.csv"
      teams:                "teams.csv"
      gameweek_summaries:   "gameweek_summaries.csv"
      player_gameweek_stats: "player_gameweek_stats.csv"
      # Per-gameweek patterns
      playerstats_gw:       "By Gameweek/{gw}/playerstats.csv"
      matches_gw:           "By Gameweek/{gw}/matches.csv"
      fixtures_gw:          "By Gameweek/{gw}/fixtures.csv"
      playermatchstats_gw:  "By Gameweek/{gw}/playermatchstats.csv"
      # Per-tournament patterns (also include gameweek nesting)
      playerstats_tournament: "By Tournament/{tournament}/playerstats.csv"
      matches_tournament:     "By Tournament/{tournament}/matches.csv"



  # Added 2026-09-07 (board card i73, delivery 1 of 2). This entry describes
  # the LAYOUT of the CSV export tree for 2026-2027; it is not an assertion
  # that those files exist on disk yet (that export does not exist for this
  # season). Existence is answered by SeasonLayout.list_available_gameweeks(),
  # not by this entry.
  #
  # Shape is copied from 2025-2026, the other in-season entry, NOT from
  # 2024-2025: that one is a finished season whose export was consolidated
  # into single files per table (has_consolidated_files: true). A season
  # still being played arrives gameweek by gameweek, so it is per-GW.
  #
  # Neither the owned store (fpl-historical) nor the tactical store
  # (fpl-tactical) reads data_root/files from here — both key their parquet
  # layout off `current_season` alone. Adding this entry therefore does not
  # repoint any read path; `current_season` above deliberately stays on
  # 2025-2026 (delivery 2 moves it, once fpl-tactical has 2026-2027 shots).
  - season: "2026-2027"
    data_root: "data/2026-2027"
    has_consolidated_files: false
    player_id_column: "id"
    gameweek_column: "gw"
    gameweek_pattern: "GW{gw}"
    files:
      players:              "players.csv"
      teams:                "teams.csv"
      gameweek_summaries:   "gameweek_summaries.csv"
      player_gameweek_stats: "player_gameweek_stats.csv"
      # Per-gameweek patterns
      playerstats_gw:       "By Gameweek/{gw}/playerstats.csv"
      matches_gw:           "By Gameweek/{gw}/matches.csv"
      fixtures_gw:          "By Gameweek/{gw}/fixtures.csv"
      playermatchstats_gw:  "By Gameweek/{gw}/playermatchstats.csv"
      # Per-tournament patterns (also include gameweek nesting)
      playerstats_tournament: "By Tournament/{tournament}/playerstats.csv"
      matches_tournament:     "By Tournament/{tournament}/matches.csv"
