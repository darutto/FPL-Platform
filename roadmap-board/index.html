<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>fpl-platform · Roadmap Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1720;
    --panel: #151f2b;
    --card: #1b2734;
    --border: #2a3a4a;
    --text: #e8eef4;
    --muted: #93a4b5;
    --idea: #8a97a3;
    --building: #22d3ee;
    --evaluation: #eab308;
    --shipped: #2dd4bf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .updated { color: var(--muted); font-size: 13px; }
  #error-banner {
    display: none;
    margin: 16px 24px 0;
    padding: 12px 16px;
    background: #3a1f1f;
    border: 1px solid #6b3030;
    border-radius: 8px;
    color: #ffb3b3;
    font-size: 14px;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(4, minmax(260px, 1fr));
    gap: 16px;
    padding: 20px 24px 40px;
    align-items: start;
  }
  .col {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    min-height: 200px;
  }
  .col h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 4px 4px 12px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.idea { background: var(--idea); }
  .dot.building { background: var(--building); }
  .dot.evaluation { background: var(--evaluation); }
  .dot.shipped { background: var(--shipped); }
  .count { margin-left: auto; opacity: 0.7; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.3; }
  .ticket {
    display: inline-block;
    margin-right: 6px;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    font: 700 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: 0.04em;
    vertical-align: 1px;
    opacity: 0.85;
  }
  .card p { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .tag {
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 999px;
    background: #22303e;
    color: #b7c6d4;
    border: 1px solid var(--border);
  }
  .bar-track {
    height: 5px;
    background: #0f1720;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; }
  .col[data-col="idea"] .bar-fill { background: var(--idea); }
  .col[data-col="building"] .bar-fill { background: var(--building); }
  .col[data-col="evaluation"] .bar-fill { background: var(--evaluation); }
  .col[data-col="shipped"] .bar-fill { background: var(--shipped); }
  .progress-label { font-size: 10.5px; color: var(--muted); margin-top: 4px; text-align: right; }
  @media (max-width: 900px) {
    #board { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px) {
    #board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>fpl-platform · Roadmap Board</h1>
  <span class="updated" id="updated"></span>
</header>
<div id="error-banner">
  No se pudo cargar data.json. Si abriste este archivo con doble clic, el navegador
  bloquea fetch() de archivos locales — usá <code>run.cmd</code> (o <code>run.ps1</code>)
  en esta misma carpeta para servirlo por http://localhost:8000.
</div>
<div id="board"></div>
<script>
  const COLS = [
    { key: "idea", label: "Idea" },
    { key: "building", label: "En construcción" },
    { key: "evaluation", label: "Evaluación" },
    { key: "shipped", label: "Entregado" },
  ];

  function renderCard(card) {
    const tags = (card.tags || [])
      .map((t) => `<span class="tag">${escapeHtml(t)}</span>`)
      .join("");
    const progress = typeof card.progress === "number" ? card.progress : 0;
    return `
      <div class="card">
        <h3><span class="ticket">${escapeHtml(card.id || "?")}</span>${escapeHtml(card.title || "")}</h3>
        <p>${escapeHtml(card.desc || "")}</p>
        <div class="tags">${tags}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${progress}%"></div></div>
        <div class="progress-label">${progress}%</div>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function render(data) {
    const board = document.getElementById("board");
    document.getElementById("updated").textContent = data.updated
      ? `actualizado ${data.updated}`
      : "";
    board.innerHTML = COLS.map(({ key, label }) => {
      const cards = (data.cards || []).filter((c) => c.col === key);
      return `
        <section class="col" data-col="${key}">
          <h2><span class="dot ${key}"></span>${label}<span class="count">${cards.length}</span></h2>
          ${cards.map(renderCard).join("")}
        </section>
      `;
    }).join("");
  }

  fetch("data.json")
    .then((r) => {
      if (!r.ok) throw new Error("bad response");
      return r.json();
    })
    .then(render)
    .catch(() => {
      document.getElementById("error-banner").style.display = "block";
    });
</script>
</body>
</html>
